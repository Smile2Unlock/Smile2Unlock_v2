name: Publish GitHub Release Artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  # Container jobs execute as root; xmake requires explicit opt-in there.
  XMAKE_ROOT: y
  # The Windows release build pulls the full Slint dependency graph; be
  # tolerant of slow/proxied registries instead of failing the release job
  # on cargo's 30s low-speed default.
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_HTTP_LOW_SPEED_LIMIT: '1'
  CARGO_HTTP_MULTIPLEXING: 'false'

jobs:
  validate-release:
    name: Validate release tag and version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Match tag to version.txt
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          [[ "$RELEASE_TAG" == "v${version}" ]] || {
            echo "release tag ${RELEASE_TAG} does not match version ${version}" >&2
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The release itself is created here so pushing a tag is all a human
      # does: notes are generated (changelog + badges + model links) and the
      # downstream jobs attach their artifacts to it. Re-running the workflow
      # skips creation when the release already exists.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; keeping its notes"
            exit 0
          fi
          prev_tag="$(git describe --abbrev=0 --tags "${RELEASE_TAG}^" 2>/dev/null || true)"
          repo="$GITHUB_REPOSITORY"
          compare_url="https://github.com/${repo}/compare/${prev_tag:-${RELEASE_TAG}^}...${RELEASE_TAG}"

          {
            echo "# Smile2Unlock v${VERSION}"
            echo
            echo "[![total downloads](https://img.shields.io/github/downloads/${repo}/total?label=total%20downloads&cacheSeconds=3600)](https://github.com/${repo}/releases)"
            echo "[![latest downloads](https://img.shields.io/github/downloads/${repo}/latest/total?label=latest%20downloads&cacheSeconds=3600)](https://github.com/${repo}/releases/latest)"
            echo
            echo "## 更新日志 / Changelog"
            echo
            if [[ -n "$prev_tag" ]]; then
              echo "[完整对比 ${prev_tag} → ${RELEASE_TAG}](${compare_url})"
              echo
              while read -r subject; do
                case "$subject" in
                  feat*)  icon='✨' ;;
                  fix*)   icon='🐛' ;;
                  perf*)  icon='⚡' ;;
                  docs*)  icon='📝' ;;
                  test*)  icon='✅' ;;
                  ci*)    icon='👷' ;;
                  chore*) icon='🔧' ;;
                  *)      icon='•' ;;
                esac
                echo "- ${icon} ${subject}"
              done < <(git log --no-merges --pretty=format:'%s' "${prev_tag}..${RELEASE_TAG}")
            else
              echo "- 首个自动发布的标签版本。"
            fi
            echo
            echo "## 下载 / Downloads"
            echo
            echo "### Linux"
            echo
            echo "[![deb](https://img.shields.io/badge/DEB-Debian%20%7C%20Ubuntu-A80030?style=flat-square&logo=debian)](https://github.com/${repo}/releases/download/${RELEASE_TAG}/smile2unlock-${VERSION}-linux-x86_64.deb)"
            echo "[![rpm](https://img.shields.io/badge/RPM-Fedora%20%7C%20openSUSE-071D49?style=flat-square)](https://github.com/${repo}/releases/download/${RELEASE_TAG}/smile2unlock-${VERSION}-linux-x86_64.rpm)"
            echo "[![pacman](https://img.shields.io/badge/PACMAN-Arch-1793D1?style=flat-square)](https://github.com/${repo}/releases/download/${RELEASE_TAG}/smile2unlock-${VERSION}-1-x86_64.pkg.tar.zst)"
            echo "[![tar.gz](https://img.shields.io/badge/TAR.GZ-通用二进制-6E7681?style=flat-square)](https://github.com/${repo}/releases/download/${RELEASE_TAG}/smile2unlock-${VERSION}-linux-x86_64.tar.gz)"
            echo
            echo "### Windows"
            echo
            echo "[![setup exe](https://img.shields.io/badge/SETUP-安装器-0078D6?style=flat-square&logo=windows)](https://github.com/${repo}/releases/download/${RELEASE_TAG}/smile2unlock-${VERSION}-windows-x86_64-setup.exe)"
            echo "[![zip](https://img.shields.io/badge/ZIP-签名压缩包-4C8CBF?style=flat-square&logo=windows)](https://github.com/${repo}/releases/download/${RELEASE_TAG}/smile2unlock-${VERSION}-windows-x86_64.zip)"
            echo
            echo "SHA-256 摘要见附件 \`SHA256SUMS\`;签名 ZIP 与安装器使用内部证书,部署时由 \`su_deploy_helper --verify\` 按编译内置指纹校验。"
            echo
            echo "## 🧠 人脸模型 / Face models"
            echo
            models_page="https://github.com/Smile2Unlock/local-repo/releases/tag/models-seetaface6-v1"
            models_badge_link="https://github.com/Smile2Unlock/local-repo/releases/download/models-seetaface6-v1/smile2unlock-models-seetaface6-v1.zip"
            echo "[![models](https://img.shields.io/badge/models-SeetaFace6-8A2BE2?style=flat-square)](${models_badge_link})"
            echo
            echo "所有发行包均已内嵌模型;独立的模型包([models-seetaface6-v1](${models_page}))由 local-repo 托管，用于离线安装与单独更新,按来源分类(当前:SeetaFace6,BSD-2-Clause)。"
          } > /tmp/release-notes.md

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Smile2Unlock v${VERSION}" \
            --notes-file /tmp/release-notes.md

  linux-package:
    name: Build Linux release archive
    needs: validate-release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed git git-lfs curl rustup cmake ninja \
            pkgconf systemd pam libx11 libxcb libxkbcommon wayland fontconfig \
            freetype2 mesa libglvnd libjpeg-turbo imagemagick patchelf python zip \
            nodejs libinput ruby ruby-rdoc dpkg rpm-tools cpio
          # fpm (deb/rpm packaging) is a ruby gem, not in the repos. Arch's
          # ruby puts gem executables in a user-local dir that later steps'
          # PATH never contains (and Gem.bindir reports the SYSTEM dir, so
          # exporting it is wrong too). Install gems system-wide and force the
          # wrappers into /usr/local/bin, then verify immediately so this fails
          # fast instead of 20 minutes later at package time.
          gem install --no-document --no-user-install --bindir /usr/local/bin fpm
          /usr/local/bin/fpm --version >/dev/null

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@f7350dc65157b629c2a98c523de814dfdda47609 # v1.2.5
        with:
          xmake-version: '3.1.1'

      - name: Cache Xmake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/packages
          key: release-linux-xmake-${{ hashFiles('local-repo/**') }}-${{ hashFiles('xmake.lua') }}
          restore-keys: release-linux-xmake-${{ hashFiles('local-repo/**') }}-

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock', 'xmake.lua') }}
          restore-keys: cargo-registry-

      - name: Install Rust toolchain
        run: bash packaging/slint/setup-rust.sh

      - name: Build Linux release
        run: |
          xmake f -y -p linux -a x86_64 -m release --with_slint=y --with_seetaface=y --seetaface_prebuilt=y
          xmake build -v

      - name: Build and verify Linux packages
        run: |
          packaging/linux/package.sh --format all --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Preserve Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-${{ needs.validate-release.outputs.version }}
          path: |
            dist/smile2unlock-${{ needs.validate-release.outputs.version }}-linux-x86_64.tar.gz
            dist/smile2unlock-${{ needs.validate-release.outputs.version }}-linux-x86_64.deb
            dist/smile2unlock-${{ needs.validate-release.outputs.version }}-linux-x86_64.rpm
            dist/smile2unlock-${{ needs.validate-release.outputs.version }}-1-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Build and sign Windows release archive
    needs: validate-release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    environment: release-signing
    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed git git-lfs curl rustup cmake ninja
          mingw-w64-gcc pkgconf imagemagick python zip unzip openssl
          nodejs scons

      # osslsigncode is not in the official repositories; build the pinned
      # upstream release instead of relying on the AUR. NSIS likewise: the
      # scons build needs only the mingw cross compiler already installed.
      - name: Install osslsigncode and NSIS from source
        run: |
          curl -fsSL https://github.com/mtrojnar/osslsigncode/archive/refs/tags/2.14.tar.gz | tar -xz -C /tmp
          cmake -S /tmp/osslsigncode-2.14 -B /tmp/osslsigncode-2.14/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/osslsigncode-2.14/build --parallel
          cmake --install /tmp/osslsigncode-2.14/build
          curl -fsSL "https://prdownloads.sourceforge.net/nsis/nsis-3.12-src.tar.bz2" | tar -xj -C /tmp
          scons -C /tmp/nsis-3.12-src SKIPDOC=all \
            SKIPUTILS="Library/RegTool,MakeLangId,Makensisw,NSIS Menu,SubStart,VPatch/Source/GenPat,zip2exe" \
            NSIS_MAX_STRLEN=8192 PREFIX=/usr/local install

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@f7350dc65157b629c2a98c523de814dfdda47609 # v1.2.5
        with:
          xmake-version: '3.1.1'

      - name: Cache Xmake packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.xmake/packages
          key: release-windows-xmake-${{ hashFiles('local-repo/**') }}-${{ hashFiles('xmake.lua') }}
          restore-keys: release-windows-xmake-${{ hashFiles('local-repo/**') }}-

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('**/Cargo.lock', 'xmake.lua') }}
          restore-keys: cargo-registry-

      - name: Install Rust toolchain for prebuilt Slint
        run: bash packaging/slint/setup-rust.sh --target x86_64-pc-windows-gnu

      - name: Seed prebuilt Slint package
        run: bash packaging/slint/seed-slint-mingw.sh

      - name: Materialize release signing identity
        shell: bash
        env:
          SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
          SIGN_KEY_BASE64: ${{ secrets.WINDOWS_SIGN_KEY_BASE64 }}
        run: |
          [[ -n "$SIGN_CERTIFICATE_BASE64" ]] || {
            echo "release-signing is missing WINDOWS_SIGN_CERTIFICATE_BASE64" >&2
            exit 1
          }
          [[ -n "$SIGN_KEY_BASE64" ]] || {
            echo "release-signing is missing WINDOWS_SIGN_KEY_BASE64" >&2
            exit 1
          }
          umask 077
          certificate="${RUNNER_TEMP}/windows-signing-chain.pem"
          private_key="${RUNNER_TEMP}/windows-signing.key"
          printf '%s' "$SIGN_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$SIGN_KEY_BASE64" | base64 --decode > "$private_key"
          # Fail before the expensive build if the key does not match the cert.
          [[ "$(openssl x509 -in "$certificate" -noout -pubkey | openssl sha256)" == \
             "$(openssl pkey -in "$private_key" -pubout | openssl sha256)" ]] || {
            echo "release-signing key does not match the certificate" >&2
            exit 1
          }
          pin="$(openssl x509 -in "$certificate" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          {
            echo "SMILE2UNLOCK_PINNED_SIGNER_SHA256=${pin}"
            echo "WINDOWS_SIGN_CERTIFICATE=${certificate}"
            echo "WINDOWS_SIGN_KEY=${private_key}"
            echo "WINDOWS_VERIFY_CA_FILE=${certificate}"
          } >> "$GITHUB_ENV"

      - name: Build Windows release
        run: |
          xmake f -y -p mingw -a x86_64 -m release --with_slint=y --with_seetaface=y
          xmake build -v

      - name: Sign, package, and verify Windows archive
        shell: bash
        env:
          # A self-signed/internal certificate cannot use a public timestamp
          # authority, so WINDOWS_TIMESTAMP_URL is optional.
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          trap 'rm -f -- "$WINDOWS_SIGN_CERTIFICATE" "$WINDOWS_SIGN_KEY"' EXIT
          packaging/windows/package.sh --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Preserve Windows archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ needs.validate-release.outputs.version }}
          path: |
            dist/smile2unlock-${{ needs.validate-release.outputs.version }}-windows-x86_64.zip
            dist/smile2unlock-${{ needs.validate-release.outputs.version }}-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish-assets:
    name: Upload verified archives to GitHub Release
    needs: [validate-release, linux-package, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          linux_archive="dist/smile2unlock-${VERSION}-linux-x86_64.tar.gz"
          linux_deb="dist/smile2unlock-${VERSION}-linux-x86_64.deb"
          linux_rpm="dist/smile2unlock-${VERSION}-linux-x86_64.rpm"
          linux_pacman="dist/smile2unlock-${VERSION}-1-x86_64.pkg.tar.zst"
          windows_archive="dist/smile2unlock-${VERSION}-windows-x86_64.zip"
          windows_setup="dist/smile2unlock-${VERSION}-windows-x86_64-setup.exe"
          release_assets=("$linux_archive" "$linux_deb" "$linux_rpm" "$linux_pacman"
                          "$windows_archive" "$windows_setup")
          for asset in "${release_assets[@]}"; do
            [[ -f "$asset" ]] || { echo "missing $asset" >&2; exit 1; }
          done
          if tar -tzf "$linux_archive" | grep -Ei '(^|/)(release-signing(/|$)|[^/]+\.(key|pem|p12|pfx)$)' >/dev/null; then
            echo "Linux archive contains signing material" >&2
            exit 1
          fi
          if unzip -Z1 "$windows_archive" | grep -Ei '(^|/)(release-signing(/|$)|[^/]+\.(key|pem|p12|pfx)$)' >/dev/null; then
            echo "Windows archive contains signing material" >&2
            exit 1
          fi
          # The same guard across every archive format we ship.
          for deb_rpm_pacman in "$linux_deb" "$linux_rpm" "$linux_pacman"; do
            if dpkg-deb -c "$deb_rpm_pacman" 2>/dev/null \
               | grep -Ei '(^|/)(release-signing(/|$)|[^/]+\.(key|pem|p12|pfx)$)' >/dev/null \
               || bsdtar -tf "$deb_rpm_pacman" 2>/dev/null \
               | grep -Ei '(^|/)(release-signing(/|$)|[^/]+\.(key|pem|p12|pfx)$)' >/dev/null; then
              echo "$deb_rpm_pacman contains signing material" >&2
              exit 1
            fi
          done
          (
            cd dist
            sha256sum "${release_assets[@]##*/}" > SHA256SUMS
          )
          gh release upload "$RELEASE_TAG" \
            "${release_assets[@]}" dist/SHA256SUMS \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
