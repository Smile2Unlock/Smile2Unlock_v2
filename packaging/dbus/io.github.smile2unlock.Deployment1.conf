<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.smile2unlock.Deployment1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.smile2unlock.Deployment1"/>
    <!-- The new source planner shares ApplyDesktopIntegration's existing
         administrator authorization; planning itself only returns a diff. -->
    <allow send_destination="io.github.smile2unlock.Deployment1"
           send_interface="io.github.smile2unlock.Deployment1"
           send_member="PlanDesktopIntegrationSource"/>
  </policy>
</busconfig>
