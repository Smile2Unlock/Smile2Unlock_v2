[package]
name = "su-credential-provider-rs"
version = "0.1.0"
edition = "2024"
description = "Rust Windows Credential Provider for Smile2Unlock (COM adapter only)"

[lib]
name = "su_credential_provider"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "enum_probe"
path = "src/bin/enum_probe.rs"

[[bin]]
name = "pipe_probe"
path = "src/bin/pipe_probe.rs"

[[bin]]
name = "cred_check"
path = "src/bin/cred_check.rs"

[[bin]]
name = "lsa_logon_test"
path = "src/bin/lsa_logon_test.rs"

[dependencies]
windows-core = "0.62.2"
zeroize = { version = "1", features = ["derive"] }
# memsafe v1.0.2 vendored fork (project patch: fail-secure Drop, no panics
# in error paths). Upstream commit 704f558a0e796e3b2fb8837ee7aabcb46c3b1250.
memsafe = { path = "vendor/memsafe" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# COM surface for the credential provider interfaces (Phase 1).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Security_Credentials",

    "Win32_System_Threading",
] }
windows-sys = { version = "0.61", features = [
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[[bin]]
name = "mock_recognizer"
path = "src/bin/mock_recognizer.rs"
