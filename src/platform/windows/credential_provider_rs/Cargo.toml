[package]
name = "su-credential-provider-rs"
version = "0.1.0"
edition = "2024"
description = "Rust Windows Credential Provider for Smile2Unlock (COM adapter only)"

[lib]
name = "su_credential_provider"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62.2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# COM surface for the credential provider interfaces (Phase 1).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_System_WindowsProgramming",
    "Win32_Security_Credentials",

    "Win32_System_Threading",
] }
windows-sys = { version = "0.61", features = [
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
